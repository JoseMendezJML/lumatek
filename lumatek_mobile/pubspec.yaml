name: lumatek_mobile
description: App móvil de Lumatek para monitoreo y control de invernaderos.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado
  flutter_riverpod: ^2.5.1

  # Red
  dio: ^5.7.0

  # Navegación
  go_router: ^14.6.1

  # Almacenamiento seguro del token Sanctum
  flutter_secure_storage: ^9.2.2

  # Formato de fechas y números en español
  intl: ^0.20.2

  # Gráficas del historial de telemetría
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
